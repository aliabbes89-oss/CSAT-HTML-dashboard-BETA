name: Update KPI dashboard data

# Runs on a schedule (checks Google Drive for a changed file every run) and
# can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC — edit to taste
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the refreshed dashboard_data.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl pandas

      - name: Download latest export from Google Sheets
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/${GSHEET_ID}/export?format=xlsx" -o latest_export.xlsx
          ls -la latest_export.xlsx

      - name: Skip run if the file hasn't changed
        id: check
        run: |
          NEW_HASH=$(sha256sum latest_export.xlsx | cut -d' ' -f1)
          OLD_HASH=$(cat .last_export_hash 2>/dev/null || echo "none")
          echo "new=$NEW_HASH" >> "$GITHUB_OUTPUT"
          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild dashboard_data.json
        if: steps.check.outputs.changed == 'true'
        run: |
          python3 transform.py latest_export.xlsx dashboard_data.json
          echo "${{ steps.check.outputs.new }}" > .last_export_hash

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "kpi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard_data.json .last_export_hash
          git commit -m "Auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push

      - name: Clean up
        if: always()
        run: rm -f latest_export.xlsx
